  - name: DATABRICKS_INSTANCE_URL
    value: "https://dbc-3bfadd9a-e170.cloud.databricks.com"
  - name: DATABRICKS_WORKSPACE_ID
    value: "7474646396737277"
  - name: DATABRICKS_DASHBOARD_ID
    value: "01f1ab77f6181dffbc49eb682d78ff21"
  - name: DATABRICKS_DASHBOARD_ID_DS
    value: "01f1a6b507501db9a393dc0d826eaa30"
