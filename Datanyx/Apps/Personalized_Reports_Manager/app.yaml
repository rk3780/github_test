  # secret, then fill in the values below. If left as placeholders, the app
  # falls back to using its own runtime token for embedding.
  - name: DATABRICKS_SP_CLIENT_ID
    value: "32ee5b7d-cca7-4e70-939d-5bcc8fd220c0"
  - name: DATABRICKS_SP_CLIENT_SECRET
    value: "dosecec164d82b277aeb268a1e3f4ad8a2de"

resources:
  - name: jobs
    description: Trigger and monitor Databricks jobs
    permissions:
      - permission: CAN_MANAGE_RUN
  - name: sql-warehouses
    description: Execute SQL queries to fetch and update scheduled reports
    permissions:
      - permission: CAN_USE