command:
  - python
  - app.py

env:
  - name: DATABRICKS_WAREHOUSE_ID
    value: "08dbc90a76824f08"

resources:
  - name: jobs
    description: Trigger and monitor Databricks jobs
    permissions:
      - permission: CAN_MANAGE_RUN
  - name: sql-warehouses
    description: Execute SQL queries to fetch and update scheduled reports
    permissions:
      - permission: CAN_USE